apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: product-service
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
      - default

  selector:
    matchLabels:
      app.kubernetes.io/name: product-service
      app.kubernetes.io/instance: product-service

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
