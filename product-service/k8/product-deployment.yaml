apiVersion: apps/v1
kind: Deployment
metadata:
  name: product-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: product-service
  template:
    metadata:
      labels:
        app: product-service
    spec:
      containers:
        - name: product-service
          image: product-service:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: product-config
            - secretRef:
                name: product-secret

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080

            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 2
            successThreshold: 1
            failureThreshold: 3

          # Uncomment if you want to use environment variables directly
          # env:
          #   - name: SPRING_DATASOURCE_URL
          #     value: jdbc:postgresql://postgres:5432/productdb
          #   - name: SPRING_DATASOURCE_USERNAME
          #     value: postgres
          #   - name: SPRING_DATASOURCE_PASSWORD
          #     value: password