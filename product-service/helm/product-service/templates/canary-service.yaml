{{- if .Values.canary.enabled }}
apiVersion: v1
kind: Service

metadata:
  name: {{ include "product-service.fullname" . }}-canary
  labels:
    {{- include "product-service.labels" . | nindent 4 }}
    track: canary

spec:
  type: {{ .Values.service.type }}

  selector:
    app: {{ include "product-service.name" . }}
    track: canary

  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
{{- end }}