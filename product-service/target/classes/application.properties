spring.datasource.url=jdbc:postgresql://localhost:5432/productdb
spring.datasource.username=postgres
spring.datasource.password=2396
management.endpoints.web.exposure.include=health,metrics,prometheus   
management.endpoint.health.probes.enabled=true 
management.endpoint.health.show-details=always
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
inventory.service.url=http://localhost:8081
resilience4j.retry.instances.inventoryRetry.max-attempts=3
resilience4j.retry.instances.inventoryRetry.wait-duration=2s
resilience4j.circuitbreaker.instances.inventoryCircuit.sliding-window-size=5
resilience4j.circuitbreaker.instances.inventoryCircuit.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.inventoryCircuit.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.inventoryCircuit.permitted-number-of-calls-in-half-open-state=2