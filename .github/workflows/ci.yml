name: Product Service CI


on:

  push:
    branches:
      - main
      - testin

  pull_request:
    branches:
      - main



jobs:

  build:

    name: Build and Security Validation

    runs-on: ubuntu-latest


    defaults:
      run:
        working-directory: product-service


    steps:


      #################################################
      # 1. Checkout Source Code
      #################################################

      - name: Checkout Source
        uses: actions/checkout@v4



      #################################################
      # 2. Setup Java Environment
      #################################################

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven



      #################################################
      # 3. Cache OWASP Dependency Check Database
      #################################################

      - name: Cache OWASP Dependency Check Database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-db-${{ runner.os }}
          restore-keys: |
            dependency-check-db-



      #################################################
      # 4. Maven Build
      #################################################

      - name: Maven Build
        run: mvn clean compile



      #################################################
      # 5. Unit Testing
      #################################################

      - name: Run Unit Tests
        run: mvn test



      #################################################
      # 6. OWASP Dependency Vulnerability Scan
      #################################################

      - name: Dependency Check
        run: |
          mvn dependency-check:check \
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}



      #################################################
      # 7. Secret Detection
      #################################################

      - name: Secret Scan - GitLeaks
        uses: gitleaks/gitleaks-action@v2