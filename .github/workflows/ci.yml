name: Product Service CI
on:

  push:
    branches:
      - main
      - testin

  pull_request:
    branches:
      - main



jobs:

  build:

    name: Build and Security Validation

    runs-on: ubuntu-latest


    defaults:
      run:
        working-directory: product-service


    steps:


      #################################################
      # 1. Checkout Source Code
      #################################################

      - name: Checkout Source
        uses: actions/checkout@v4



      #################################################
      # 2. Setup Java Environment
      #################################################

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven



      # #################################################
      # # 3. Cache OWASP Dependency Check Database
      # #################################################

      # - name: Cache OWASP Dependency Check Database
      #   uses: actions/cache@v4
      #   with:
      #     path: ~/.dependency-check
      #     key: dependency-check-${{ runner.os }}
      #     restore-keys: |
      #       dependency-check-${{ runner.os }}



      #################################################
      # 4. Maven Build and Unit Test
      #################################################

      - name: Maven Build and Test
        run: mvn clean package 



      # #################################################
      # # 5. Unit Testing
      # #################################################

      # - name: Run Unit Tests
      #   run: mvn test



      #################################################
      # 6. OWASP Dependency Vulnerability Scan
      #################################################

      # - name: Dependency Check
      #   run: |
      #     mvn org.owasp:dependency-check-maven:12.1.0:check \
      #     -DnvdApiKey=${{ secrets.NVD_API_KEY }}

  # gitleaks:
  #   name: Secret Scan
  #   needs: build
  # if: always()
  #   runs-on: ubuntu-latest

  #   steps:
  #     - name: Checkout Source
  #       uses: actions/checkout@v4

  #     - name: Secret Scan - GitLeaks
  #       uses: gitleaks/gitleaks-action@v2

      #################################################
      # 7. Secret Detection
      #################################################

      - name: Secret Scan - GitLeaks
        uses: gitleaks/gitleaks-action@v2

      - name: Generate SBOM
        run: mvn cyclonedx:makeBom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: product-service/target/bom.json

      - name: Show current directory
        run: pwd

      - name: Build Docker Image
        run: docker build -t product-service:${{ github.sha }} .

      # - name: Import Image into k3d Cluster
      #   run: |
      #     k3d image import product-service:${{ github.sha }} -c mycluster

      - name: Trivy Image Scan
        uses: aquasecurity/trivy-action@v0.33.1

        with:
          image-ref: product-service:${{ github.sha }}
          format: table
          output: ${{ github.workspace }}/trivy-report.txt
          severity: CRITICAL,HIGH
          exit-code: 0 

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: ${{ github.workspace }}/trivy-report.txt

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.sha }}


      
      - name: Debug image-ref
        run: |
          echo "github.sha = ${{ github.sha }}"
          echo "image-ref = product-service:${{ github.sha }}"
