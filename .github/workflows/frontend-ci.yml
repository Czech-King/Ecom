name: Frontend CI

on:
  workflow_call:

jobs:

  build:

    name: Build and Security Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      #################################################
      # Dockerfile performs:
      # npm ci
      # npm run build
      # Nginx runtime image
      #################################################

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/ecom-frontend:${{ github.sha }} .

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Scan Image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            --output trivy-report.txt \
            --exit-code 0 \
            ${{ secrets.DOCKERHUB_USERNAME }}/ecom-frontend:${{ github.sha }}

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecom-frontend-trivy-${{ github.sha }}
          path: frontend/trivy-report.txt

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/ecom-frontend:${{ github.sha }}
