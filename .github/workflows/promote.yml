name: Promote Product Service

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git SHA image tag to promote"
        required: true
        type: string

jobs:
  deploy-prod:
    name: Deploy Product Service to Production
    runs-on: self-hosted

    environment:
      name: prod

    defaults:
      run:
        working-directory: product-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify Kubernetes connectivity
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy to Production
        run: |
          helm upgrade --install product-service \
            ./helm/product-service \
            -f ./helm/product-service/values.yaml \
            -f ./helm/product-service/values-stage.yaml \
            --set image.tag=${{ inputs.image_tag }} \
            --namespace stage \
            --create-namespace
            --wait \
            --timeout 5m \
            --atomic

      - name: Verify Deployment
        run: |
          kubectl rollout status deployment/product-service --timeout=5m
          kubectl get deployment product-service
          kubectl get pods
