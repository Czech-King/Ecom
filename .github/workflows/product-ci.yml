name: Product Service CI

on:
  workflow_call:

jobs:

  build:

    name: Build and Security Validation
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: product-service

    steps:

      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Maven Build and Test
        run: mvn clean package

      - name: Secret Scan - GitLeaks
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      - name: Generate SBOM
        run: mvn cyclonedx:makeBom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: product-service-sbom-${{ github.sha }}
          path: product-service/target/bom.json

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.sha }} .

      - name: Install Trivy
        run: |
          sudo apt-get update
          sudo apt-get install -y wget
          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sudo sh -s -- -b /usr/local/bin

      - name: Scan Image
        run: |
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            --output trivy-report.txt \
            --exit-code 0 \
            ${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.sha }}

      - name: Upload Trivy Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: product-service-trivy-${{ github.sha }}
          path: product-service/trivy-report.txt

      - name: Push Docker Image
        run: |
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/product-service:${{ github.sha }}


