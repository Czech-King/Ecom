name: Ecom CD

on:
  workflow_run:
    workflows:
      - Ecom CI
    types:
      - completed
    branches:
      - main
      - testin

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git SHA image tag to deploy"
        required: true
        type: string

jobs:
  detect-changes:
    name: Detect Changed Services
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    outputs:
      product: ${{ steps.filter.outputs.product }}
      inventory: ${{ steps.filter.outputs.inventory }}
      frontend: ${{ steps.filter.outputs.frontend }}
      image_tag: ${{ steps.tag.outputs.image_tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Determine Image Tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "image_tag=${{ inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect Changed Services
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            product:
              - 'product-service/**'
            inventory:
              - 'inventory-service/**'
            frontend:
              - 'frontend/**'
          base: ${{ github.event.workflow_run.head_sha }}~1

  deploy-product:
    name: Deploy Product Service
    needs: detect-changes
    if: needs.detect-changes.outputs.product == 'true'
    runs-on: self-hosted
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify Kubernetes
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy Product Service
        working-directory: product-service
        run: |
          helm upgrade --install product-service ./helm/product-service \
            -f ./helm/product-service/values.yaml \
            -f ./helm/product-service/values-prod.yaml \
            --set image.tag=${{ needs.detect-changes.outputs.image_tag }} \
            --wait \
            --timeout 10m \
            --rollback-on-failure \
            --cleanup-on-fail

      - name: Verify Product Deployment
        run: |
          kubectl rollout status deployment/product-service --timeout=10m
          kubectl get deployment product-service
          kubectl get pods -l app=product-service

  deploy-inventory:
    name: Deploy Inventory Service
    needs: detect-changes
    if: needs.detect-changes.outputs.inventory == 'true'
    runs-on: self-hosted
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify Kubernetes
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy Inventory Service
        working-directory: inventory-service
        run: |
          helm upgrade --install inventory-service ./helm/inventory-service \
            -f ./helm/inventory-service/values.yaml \
            -f ./helm/inventory-service/values-prod.yaml \
            --set image.tag=${{ needs.detect-changes.outputs.image_tag }} \
            --wait \
            --timeout 10m \
            --rollback-on-failure \
            --cleanup-on-fail

      - name: Verify Inventory Deployment
        run: |
          kubectl rollout status deployment/inventory-service --timeout=10m
          kubectl get deployment inventory-service
          kubectl get pods -l app=inventory-service

  deploy-frontend:
    name: Deploy Frontend
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true'
    runs-on: self-hosted
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Verify Kubernetes
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy Frontend
        working-directory: frontend
        run: |
          helm upgrade --install frontend ./helm/frontend \
            -f ./helm/frontend/values.yaml \
            -f ./helm/frontend/values-prod.yaml \
            --set image.tag=${{ needs.detect-changes.outputs.image_tag }} \
            --wait \
            --timeout 10m \
            --rollback-on-failure \
            --cleanup-on-fail

      - name: Verify Frontend Deployment
        run: |
          kubectl rollout status deployment/frontend --timeout=10m
          kubectl get deployment frontend
          kubectl get pods -l app=frontend
